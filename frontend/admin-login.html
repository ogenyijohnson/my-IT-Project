
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("images/campus.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            width: 100%;
            min-height: 75px;
            background: #ffffff;
            display: flex;
            align-items: center;
            padding: 10px 7%;
            gap: 12px;
        }

        .navbar img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .navbar h2 {
            color: #087a3e;
            font-size: 19px;
            font-weight: 600;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
        }

        .login-card h1 {
            color: #087a3e;
            font-size: 25px;
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            color: #666666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #087a3e;
        }

        .form-group input.invalid {
            border-color: #dc2626;
        }

        .message {
            display: none;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }

        .message.error {
            color: #dc2626;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #087a3e;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #066331;
        }

        .login-btn:disabled {
            background: #999999;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #087a3e;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            background: #ffffff;
            padding: 17px 10px;
            text-align: center;
            color: #666666;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 10px 5%;
            }

            .navbar h2 {
                font-size: 16px;
            }

            .login-card {
                padding: 25px 20px;
            }

            .login-card h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar" id="main-navbar">
        <img src="images/school-logo.png" alt="University of Nigeria logo">
        <h2>UNN Computer Science Department</h2>
    </nav>

    <main class="main-container">

        <section class="login-card" id="admin-login-section">

            <h1>Admin Login</h1>

            <p class="description">
                Sign in to manage the departmental election.
            </p>

            <form id="admin-login-form">

                <div class="form-group">
                    <label for="admin-username">Username</label>
                    <input
                        type="text"
                        id="admin-username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input
                        type="password"
                        id="admin-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p class="message error" id="admin-login-message"></p>

                <button type="submit" class="login-btn" id="admin-login-btn">
                    Login
                </button>

            </form>

            <a href="index.html" class="back-link" id="back-to-home-link">
                Back to Home
            </a>

        </section>

    </main>

    <footer id="main-footer">
        © 2026 University of Nigeria, Nsukka. Computer Science Department.
    </footer>

    <script>
        // Get page elements
        const adminLoginForm = document.getElementById("admin-login-form");
        const adminUsername = document.getElementById("admin-username");
        const adminPassword = document.getElementById("admin-password");
        const adminLoginMessage = document.getElementById("admin-login-message");
        const adminLoginBtn = document.getElementById("admin-login-btn");

        // Display login message
        function displayLoginMessage(message) {
            adminLoginMessage.textContent = message;
            adminLoginMessage.style.display = "block";
        }

        // Handle admin login
        adminLoginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            adminLoginMessage.style.display = "none";
            adminUsername.classList.remove("invalid");
            adminPassword.classList.remove("invalid");

            const username = adminUsername.value.trim();
            const password = adminPassword.value;

            if (!username) {
                adminUsername.classList.add("invalid");
                displayLoginMessage("Enter your username.");
                return;
            }

            if (!password) {
                adminPassword.classList.add("invalid");
                displayLoginMessage("Enter your password.");
                return;
            }

            adminLoginBtn.disabled = true;
            adminLoginBtn.textContent = "Logging in...";

            try {
                // Connect to the admin login backend
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    displayLoginMessage(
                        result.message || "Invalid username or password."
                    );
                    return;
                }

                // Confirm that the authenticated account is an admin
                if (result.role !== "admin") {
                    displayLoginMessage("You are not authorized to access this page.");
                    return;
                }

                // Open the admin dashboard
                window.location.href = "admin-dashboard.html";

            } catch (error) {
                displayLoginMessage(
                    "Unable to connect to the server. Please try again."
                );
            } finally {
                adminLoginBtn.disabled = false;
                adminLoginBtn.textContent = "Login";
            }
        });

        // Clear errors when fields are edited
        adminUsername.addEventListener("input", function() {
            this.classList.remove("invalid");
            adminLoginMessage.style.display = "none";
        });

        adminPassword.addEventListener("input", function() {
            this.classList.remove("invalid");
            adminLoginMessage.style.display = "none";
        });
    </script>

</body>
</html>
