
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Already Voted</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7f4;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #087a3e;
            color: white;
            padding: 15px 6%;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .navbar h2 {
            font-size: 18px;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .message-card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
        }

        .message-icon {
            width: 75px;
            height: 75px;
            background: #fff3e0;
            color: #d97706;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            margin: 0 auto 22px;
        }

        .message-card h1 {
            color: #087a3e;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .message-card p {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .message-card a {
            display: inline-block;
            background: #087a3e;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 6px;
            font-size: 15px;
        }

        .message-card a:hover {
            background: #056331;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .message-card {
                padding: 35px 20px;
            }

            .message-card h1 {
                font-size: 22px;
            }

            .navbar h2 {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar" id="main-navbar">
        <img src="images/school-logo.png" alt="UNN Logo">
        <h2>UNN Computer Science Department</h2>
    </nav>

    <main class="main-content">
        <section class="message-card" id="already-voted-section">

            <div class="message-icon">
                &#10003;
            </div>

            <h1>You've Already Voted</h1>

            <p>
                Our records show that you have already participated
                in this election. Each eligible student is allowed
                to vote only once.
            </p>

            <a href="index.html" id="return-to-login-btn">
                Return to Login
            </a>

        </section>
    </main>

    <footer id="main-footer">
        © 2026 University of Nigeria, Nsukka. Computer Science Department.
    </footer>

</body>
</html>
