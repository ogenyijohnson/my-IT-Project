<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNN Computer Science Election</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)), url("images/campus.jpg") center/cover fixed; }
        .navbar { width: 100%; background: white; padding: 15px 7%; display: flex; justify-content: space-between; align-items: center; }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-section img { width: 45px; height: 45px; object-fit: contain; }
        .logo-section h2 { color: #087c3e; font-size: 17px; }
        .admin-link { color: #087c3e; text-decoration: none; font-size: 14px; font-weight: bold; }
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 35px 15px; }
        .auth-card { background: white; width: 100%; max-width: 430px; padding: 35px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,.2); }
        .page-heading { text-align: center; margin-bottom: 25px; }
        .page-heading h1 { color: #087c3e; font-size: 25px; margin-bottom: 10px; }
        .page-heading p { color: #666; font-size: 14px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #333; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 13px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .form-group input:focus { border-color: #087c3e; }
        .form-group input.invalid { border-color: #d93025; }
        .submit-btn, .secondary-btn { width: 100%; padding: 13px; border-radius: 5px; font-size: 15px; cursor: pointer; }
        .submit-btn { background: #087c3e; color: white; border: none; margin-top: 5px; }
        .submit-btn:hover { background: #05632f; }
        button:disabled { opacity: .65; cursor: wait; }
        .secondary-btn { margin-top: 10px; background: white; border: 1px solid #087c3e; color: #087c3e; }
        .toggle-text { text-align: center; margin-top: 22px; color: #666; font-size: 14px; }
        .toggle-text button { background: none; border: none; color: #087c3e; font-weight: bold; cursor: pointer; font-size: 14px; }
        .form-message { display: none; padding: 11px; margin-bottom: 15px; border-radius: 5px; font-size: 13px; line-height: 1.5; }
        .form-message.error { display: block; background: #fdeaea; color: #b42318; }
        .form-message.info { display: block; background: #eaf4ff; color: #175a91; }
        .hidden { display: none; }
        footer { background: white; padding: 15px; text-align: center; color: #555; font-size: 12px; }
        @media (max-width: 500px) { .navbar { padding: 12px 5%; } .logo-section img { width: 38px; height: 38px; } .logo-section h2 { font-size: 13px; } .admin-link { font-size: 12px; } .auth-card { padding: 28px 22px; } .page-heading h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <nav class="navbar" id="main-navbar">
        <div class="logo-section"><img src="/images/logoo.jfif" alt="UNN Logo"><h2>UNN Computer Science</h2></div>
        <a href="admin-login.html" class="admin-link" id="admin-login-link">Admin Login</a>
    </nav>
    <main class="main-container">
        <div class="auth-card">
            <section id="student-login-section">
                <div class="page-heading"><h1>Student Login</h1><p>Access the Computer Science Departmental Election Portal.</p></div>
                <form id="student-login-form" novalidate>
                    <div class="form-message" id="login-message" role="status" aria-live="polite"></div>
                    <div class="form-group"><label for="login-matric-number">Matriculation Number</label><input type="text" id="login-matric-number" name="matric_number" placeholder="2023/214283" autocomplete="username" maxlength="11" required></div>
                    <div class="form-group hidden" id="login-otp-group"><label for="login-otp">Six-digit email verification code</label><input type="text" id="login-otp" name="token" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code"></div>
                    <button type="submit" class="submit-btn" id="student-login-btn">Login</button>
                    <button type="button" class="secondary-btn hidden" id="resend-login-code-btn">Resend verification code</button>
                    <button type="button" class="secondary-btn hidden" id="change-login-number-btn">Use a different matric number</button>
                </form>
                <div class="toggle-text" id="registration-toggle">Not registered? <button type="button" id="show-registration-btn">Register here</button></div>
            </section>
            <section id="student-registration-section" class="hidden">
                <div class="page-heading"><h1>Student Registration</h1><p>Register for the Computer Science Departmental Election.</p></div>
                <form id="student-registration-form" novalidate>
                    <div class="form-message" id="registration-message"></div>
                    <div class="form-group"><label for="registration-matric-number">Matriculation Number</label><input type="text" id="registration-matric-number" name="matric_number" placeholder="2023/214283" maxlength="11" required></div>
                    <div class="form-group"><label for="registration-email">Email Address</label><input type="email" id="registration-email" name="email" placeholder="Enter your email address" autocomplete="email" required></div>
                    <button type="submit" class="submit-btn" id="student-registration-btn">Continue</button>
                </form>
                <div class="toggle-text">Already registered? <button type="button" id="show-login-btn">Login here</button></div>
            </section>
        </div>
    </main>
    <footer id="main-footer">&copy; 2026 University of Nigeria, Nsukka. Computer Science Department.</footer>
    <script>
        const loginSection = document.getElementById("student-login-section");
        const registrationSection = document.getElementById("student-registration-section");
        const loginForm = document.getElementById("student-login-form");
        const matricInput = document.getElementById("login-matric-number");
        const otpInput = document.getElementById("login-otp");
        const otpGroup = document.getElementById("login-otp-group");
        const loginButton = document.getElementById("student-login-btn");
        const resendButton = document.getElementById("resend-login-code-btn");
        const changeNumberButton = document.getElementById("change-login-number-btn");
        const registrationToggle = document.getElementById("registration-toggle");
        let awaitingLoginCode = false;

        function isValidMatricNumber(value) { return /^202[3-6]\/\d{6}$/.test(value); }
        function showMessage(id, message, type) {
            const element = document.getElementById(id);
            element.textContent = message;
            element.className = "form-message " + type;
        }
        function clearMessages() {
            document.querySelectorAll(".form-message").forEach(element => {
                element.textContent = "";
                element.className = "form-message";
            });
            document.querySelectorAll("input").forEach(input => input.classList.remove("invalid"));
        }
        async function readResponse(response) {
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.message || `Request failed (${response.status}).`);
            return result;
        }
        async function requestLoginCode() {
            const matricNumber = matricInput.value.trim();
            if (!isValidMatricNumber(matricNumber)) {
                matricInput.classList.add("invalid");
                showMessage("login-message", "Enter the correct matric number format. Example: 2023/214283.", "error");
                return;
            }
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ matric_number: matricNumber })
            });
            const result = await readResponse(response);
            awaitingLoginCode = true;
            matricInput.disabled = true;
            otpGroup.classList.remove("hidden");
            resendButton.classList.remove("hidden");
            changeNumberButton.classList.remove("hidden");
            registrationToggle.classList.add("hidden");
            loginButton.textContent = "Verify code";
            otpInput.focus();
            showMessage("login-message", result.message || "A verification code was sent to your registered email.", "info");
        }

        loginForm.addEventListener("submit", async event => {
            event.preventDefault();
            clearMessages();
            loginButton.disabled = true;
            try {
                if (!awaitingLoginCode) {
                    await requestLoginCode();
                    return;
                }
                const token = otpInput.value.trim();
                if (!/^\d{6}$/.test(token)) {
                    otpInput.classList.add("invalid");
                    showMessage("login-message", "Enter the six-digit verification code sent to your email.", "error");
                    return;
                }
                const response = await fetch("/api/auth/verify-login-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ matric_number: matricInput.value.trim(), token })
                });
                const result = await readResponse(response);
                if (!result.session || !result.student) throw new Error("Login response did not include a student session.");
                sessionStorage.setItem("student_session", JSON.stringify(result.session));
                sessionStorage.setItem("student", JSON.stringify(result.student));
                sessionStorage.setItem("student_access_token", result.session.access_token);
                window.location.href = "voting.html";
            } catch (error) {
                showMessage("login-message", error.message || "Unable to connect to the server. Please try again.", "error");
            } finally {
                loginButton.disabled = false;
            }
        });

        resendButton.addEventListener("click", async () => {
            clearMessages();
            resendButton.disabled = true;
            try {
                await requestLoginCode();
                showMessage("login-message", "A new verification code was sent to your registered email.", "info");
            } catch (error) {
                showMessage("login-message", error.message || "Unable to resend the code.", "error");
            } finally {
                resendButton.disabled = false;
            }
        });
        changeNumberButton.addEventListener("click", () => {
            awaitingLoginCode = false;
            matricInput.disabled = false;
            otpInput.value = "";
            otpGroup.classList.add("hidden");
            resendButton.classList.add("hidden");
            changeNumberButton.classList.add("hidden");
            registrationToggle.classList.remove("hidden");
            loginButton.textContent = "Login";
            clearMessages();
            matricInput.focus();
        });
        otpInput.addEventListener("input", () => { otpInput.value = otpInput.value.replace(/\D/g, "").slice(0, 6); });
        document.getElementById("show-registration-btn").addEventListener("click", () => {
            loginSection.classList.add("hidden");
            registrationSection.classList.remove("hidden");
            clearMessages();
        });
        document.getElementById("show-login-btn").addEventListener("click", () => {
            registrationSection.classList.add("hidden");
            loginSection.classList.remove("hidden");
            clearMessages();
        });
        document.getElementById("student-registration-form").addEventListener("submit", event => {
            event.preventDefault();
            showMessage("registration-message", "Registration will be activated when the backend is connected.", "info");
        });
    </script>
</body>
</html>
